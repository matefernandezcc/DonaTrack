# =============================================
# Profile: prod (Supabase & CloudAMQP)
# Activar: SPRING_PROFILES_ACTIVE=prod
# =============================================

spring.datasource.url=jdbc:postgresql://${SUPABASE_HOST}:${SUPABASE_PORT:5432}/postgres?currentSchema=incentivos
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}

# En prod las tablas ya están creadas en Supabase (evita timeout de escaneo Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# RabbitMQ en la nube (CloudAMQP)
spring.rabbitmq.host=${CLOUDAMQP_HOST}
spring.rabbitmq.port=${CLOUDAMQP_PORT:5671}
spring.rabbitmq.username=${CLOUDAMQP_USERNAME}
spring.rabbitmq.password=${CLOUDAMQP_PASSWORD}
spring.rabbitmq.virtual-host=${CLOUDAMQP_VIRTUAL_HOST}
spring.rabbitmq.ssl.enabled=${CLOUDAMQP_SSL_ENABLED:true}
