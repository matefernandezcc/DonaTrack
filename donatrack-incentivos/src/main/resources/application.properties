server.port=${PORT:8001}
spring.cloud.compatibility-verifier.enabled=false
spring.application.name=donatrack-incentivos
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# --- Actuator & Prometheus Metrics ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.show-details=when-authorized
management.health.rabbit.enabled=false
management.metrics.tags.application=${spring.application.name}

# --- Distributed Tracing (Zipkin) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:donatrack}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=incentivos

# --- Datasource defaults (sobreescribibles por profile o env vars) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:donatrack}?currentSchema=incentivos
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# --- Feign Clients ---
personas.api.url=${PERSONAS_API_URL:http://localhost:8000}
