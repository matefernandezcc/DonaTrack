<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DonaTrack Animation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f5f7fb;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Inter", sans-serif;
      overflow: hidden;
    }

    .container {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    /* BOX */

    .box-wrapper {
      position: relative;
      width: 82px;
      height: 82px;

      animation:
        slideIn 1.2s cubic-bezier(.22,1,.36,1) forwards,
        floatBox 2s ease-in-out infinite 1.2s;
    }

    .speed-line {
      position: absolute;
      height: 6px;
      border-radius: 999px;
      background: #d0d7e2;
      left: -60px;
      opacity: 0;

      animation: lines 0.8s ease forwards;
    }

    .line1 {
      width: 42px;
      top: 22px;
    }

    .line2 {
      width: 26px;
      top: 38px;
      animation-delay: .08s;
    }

    .line3 {
      width: 35px;
      top: 54px;
      animation-delay: .15s;
    }

    .box {
      width: 82px;
      height: 82px;
      background: #111827;
      border-radius: 24px;
      position: relative;
      overflow: hidden;

      box-shadow:
        0 10px 30px rgba(0,0,0,.10),
        0 2px 10px rgba(0,0,0,.05);
    }

    .lid {
      position: absolute;
      width: 100%;
      height: 50%;
      background: #1f2937;
      top: 0;
      left: 0;
      transform-origin: top;
      animation: openLid .8s cubic-bezier(.22,1,.36,1) 1.6s forwards;
      border-bottom: 1px solid rgba(255,255,255,.06);
    }

    .dt {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;

      color: white;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -2px;

      opacity: 0;
      transform: scale(.6);

      animation: showDT .7s cubic-bezier(.22,1,.36,1) 2s forwards;
    }

    /* TEXT */

    .brand {
      display: flex;
      align-items: center;
      overflow: hidden;
    }

    .dona {
      font-size: 54px;
      font-weight: 700;
      letter-spacing: -3px;
      color: #111827;

      width: 0;
      overflow: hidden;
      white-space: nowrap;

      animation: revealText 1s cubic-bezier(.22,1,.36,1) 2.5s forwards;
    }

    .track {
      color: #6b7280;
    }

    /* ANIMATIONS */

    @keyframes slideIn {
      from {
        transform: translateX(-220px);
        opacity: 0;
      }
      to {
        transform: translateX(0);
        opacity: 1;
      }
    }

    @keyframes lines {
      from {
        opacity: 0;
        transform: translateX(30px);
      }
      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    @keyframes openLid {
      0% {
        transform: rotateX(0deg);
      }

      100% {
        transform: rotateX(120deg) translateY(-12px);
      }
    }

    @keyframes showDT {
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes revealText {
      from {
        width: 0;
        opacity: 0;
      }

      to {
        width: 320px;
        opacity: 1;
      }
    }

    @keyframes floatBox {
      0%,100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

  </style>
</head>
<body>

  <div class="container">

    <div class="box-wrapper">

      <div class="speed-line line1"></div>
      <div class="speed-line line2"></div>
      <div class="speed-line line3"></div>

      <div class="box">
        <div class="lid"></div>
        <div class="dt">DT</div>
      </div>

    </div>

    <div class="brand">
      <div class="dona">
        Dona<span class="track">Track</span>
      </div>
    </div>

  </div>

</body>
</html>
