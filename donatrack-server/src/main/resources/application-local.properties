# =============================================
# Profile: local (PostgreSQL Docker + MongoDB Docker)
# =============================================
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:donatrack}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# MongoDB Local
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:donatrack_logistica}
spring.data.mongodb.username=${MONGO_USERNAME:donatrack}
spring.data.mongodb.password=${MONGO_PASSWORD:donatrack}
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB:admin}

