server.port=8080
spring.application.name=donatrack-server
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.cloud.compatibility-verifier.enabled=false
spring.main.allow-bean-definition-overriding=true
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false

# --- RabbitMQ ---
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:donatrack}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# --- PostgreSQL Datasource Defaults ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:donatrack}
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# --- MongoDB Defaults (módulo logistica) ---
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:donatrack_logistica}
spring.data.mongodb.username=${MONGO_USERNAME:donatrack}
spring.data.mongodb.password=${MONGO_PASSWORD:donatrack}
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB:admin}
spring.data.mongodb.auto-index-creation=true
