# ── Test overrides ──
# Usamos H2 in-memory para no depender de Postgres.
# INIT crea los schemas que las entities JPA esperan (schema = "logistica", "donaciones", etc.)
# H2 no los crea automáticamente como PostgreSQL.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS DONACIONES\\;CREATE SCHEMA IF NOT EXISTS INCENTIVOS\\;CREATE SCHEMA IF NOT EXISTS LOGISTICA\\;CREATE SCHEMA IF NOT EXISTS NOTIFICACIONES
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true

spring.cloud.compatibility-verifier.enabled=false
spring.main.allow-bean-definition-overriding=true

# Deshabilitamos los listeners de RabbitMQ para que no intenten conectarse al broker
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
