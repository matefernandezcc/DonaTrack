# ── Test overrides ──
# Usamos H2 in-memory para no depender de Postgres.
# INIT crea los schemas que las entities JPA esperan (schema = "logistica", etc.)
# H2 no los crea automáticamente como PostgreSQL.
spring.datasource.url=jdbc:h2:mem:testdb;INIT=CREATE SCHEMA IF NOT EXISTS LOGISTICA
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop

spring.cloud.compatibility-verifier.enabled=false
spring.main.allow-bean-definition-overriding=true

# Deshabilitamos los listeners de RabbitMQ para que no intenten conectarse al broker
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
