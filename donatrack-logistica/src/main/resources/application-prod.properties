# =============================================
# Profile: prod (Supabase)
# Activar: SPRING_PROFILES_ACTIVE=prod
# =============================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SUPABASE_HOST:aws-1-us-east-1.pooler.supabase.com}:${SUPABASE_PORT:5432}/postgres?currentSchema=logistica
spring.datasource.username=${SUPABASE_USER:postgres.nkqyubnzckxojsubyiuk}
spring.datasource.password=${SUPABASE_PASSWORD:postgres}

# Dialecto explícito para evitar problemas de detección automática
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# En prod Hibernate actualiza tablas automáticamente si falta algo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Si en prod no hay RabbitMQ levantado, no bloquear el inicio de los listeners
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:false}
