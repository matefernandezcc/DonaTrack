# =============================================
# Profile: prod (Supabase)
# Activar: SPRING_PROFILES_ACTIVE=prod
# =============================================

spring.datasource.url=jdbc:postgresql://${SUPABASE_HOST}:${SUPABASE_PORT:5432}/postgres?currentSchema=logistica
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}

# En prod las tablas se crean manualmente (migraciones SQL), Hibernate solo valida
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
