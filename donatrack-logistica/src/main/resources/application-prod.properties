# =============================================
# Profile: prod (Supabase)
# Activar: SPRING_PROFILES_ACTIVE=prod
# =============================================

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://${SUPABASE_HOST:aws-1-us-east-1.pooler.supabase.com}:${SUPABASE_PORT:5432}/postgres?currentSchema=logistica
spring.datasource.username=${SUPABASE_USER:postgres.nkqyubnzckxojsubyiuk}
spring.datasource.password=${SUPABASE_PASSWORD:postgres}

# Dialecto explícito para evitar problemas de detección automática
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Limitar conexiones Hikari para Supabase Free-Tier Session Pooler (máx 15 compartidas)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000

# En prod Hibernate actualiza tablas automáticamente si falta algo
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Si en prod no hay RabbitMQ levantado, no bloquear el inicio de los listeners ni el health check
spring.rabbitmq.listener.simple.auto-startup=${RABBITMQ_ENABLED:false}
management.health.rabbit.enabled=false

