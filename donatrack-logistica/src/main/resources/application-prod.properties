# =============================================
# Profile: prod (MongoDB Atlas & CloudAMQP)
# Activar: SPRING_PROFILES_ACTIVE=prod
# =============================================

# --- MongoDB Atlas (Persistencia Documental ODM en Producción) ---
spring.data.mongodb.uri=${MONGO_ATLAS_URI}
spring.data.mongodb.database=${MONGO_ATLAS_DATABASE:donatrack_logistica}
spring.data.mongodb.auto-index-creation=true

# RabbitMQ en la nube (CloudAMQP)
spring.rabbitmq.host=${CLOUDAMQP_HOST}
spring.rabbitmq.port=${CLOUDAMQP_PORT:5671}
spring.rabbitmq.username=${CLOUDAMQP_USERNAME}
spring.rabbitmq.password=${CLOUDAMQP_PASSWORD}
spring.rabbitmq.virtual-host=${CLOUDAMQP_VIRTUAL_HOST}
spring.rabbitmq.ssl.enabled=${CLOUDAMQP_SSL_ENABLED:true}

# --- Supabase S3 en Producción (Cloud Storage) ---
supabase.s3.enabled=${SUPABASE_S3_ENABLED:true}
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://nkqyubnzckxojsubyiuk.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_S3_REGION:us-east-1}
supabase.s3.access-key-id=${SUPABASE_S3_ID:}
supabase.s3.secret-access-key=${SUPABASE_S3_KEY:}
supabase.s3.bucket=${SUPABASE_S3_BUCKET:remitos}
supabase.s3.public-url-base=${SUPABASE_S3_PUBLIC_BASE:https://nkqyubnzckxojsubyiuk.supabase.co/storage/v1/object/public/remitos}

# Seguridad Inter-Servicios M2M (estricta en produccion)
donatrack.security.enabled=true
