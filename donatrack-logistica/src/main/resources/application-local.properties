# =============================================
# Profile: local (desarrollo con Docker Postgres)
# Activar: mvn spring-boot:run -Dspring-boot.run.profiles=local
# =============================================

spring.datasource.url=jdbc:postgresql://localhost:5432/donatrack?currentSchema=logistica
spring.datasource.username=postgres
spring.datasource.password=postgres

# Hibernate crea/actualiza tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
