# =============================================
# Profile: local (desarrollo con Docker Postgres y MongoDB)
# Activar: mvn spring-boot:run -Dspring-boot.run.profiles=local
# =============================================

# --- MongoDB Local ---
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:donatrack_logistica}
spring.data.mongodb.username=${MONGO_USERNAME:donatrack}
spring.data.mongodb.password=${MONGO_PASSWORD:donatrack}
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=true

# --- PostgreSQL Local ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:donatrack}?currentSchema=logistica
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Hibernate crea/actualiza tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
