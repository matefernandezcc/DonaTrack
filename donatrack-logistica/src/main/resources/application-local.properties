# =============================================
# Profile: local (desarrollo con Docker MongoDB)
# Activar: mvn spring-boot:run -Dspring-boot.run.profiles=local
# =============================================

# --- MongoDB Local ---
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:donatrack_logistica}
spring.data.mongodb.username=${MONGO_USERNAME:donatrack}
spring.data.mongodb.password=${MONGO_PASSWORD:donatrack}
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB:admin}
spring.data.mongodb.auto-index-creation=true

