server.port=${PORT:8002}
spring.cloud.compatibility-verifier.enabled=false
spring.application.name=donatrack-logistica
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
management.endpoint.health.show-details=always

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:donatrack}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# --- MongoDB auto-index ---
spring.data.mongodb.auto-index-creation=true

