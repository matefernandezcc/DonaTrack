server.port=${PORT:8002}
spring.cloud.compatibility-verifier.enabled=false
spring.application.name=donatrack-logistica
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
management.endpoint.health.show-details=always

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:donatrack}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# --- MongoDB (Persistencia Documental ODM) ---
spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DATABASE:donatrack_logistica}
spring.data.mongodb.username=${MONGO_USERNAME:donatrack}
spring.data.mongodb.password=${MONGO_PASSWORD:donatrack}
spring.data.mongodb.authentication-database=${MONGO_AUTH_DB:admin}
spring.data.mongodb.auto-index-creation=true

# --- JPA / Hibernate (Legado transitorio) ---
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=logistica

# --- Datasource defaults (sobreescribibles por profile o env vars) ---
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:donatrack}?currentSchema=logistica
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
