server.port=${PORT:8002}
spring.cloud.compatibility-verifier.enabled=false
spring.application.name=donatrack-logistica
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
# --- Actuator & Prometheus Metrics ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.access=unrestricted
management.endpoint.health.show-details=when-authorized
management.health.rabbit.enabled=false
management.metrics.tags.application=${spring.application.name}

# --- Distributed Tracing (Zipkin) ---
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}

# --- RabbitMQ ---
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:donatrack}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:donatrack}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:/}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL_ENABLED:false}

# --- MongoDB auto-index & UUID representation ---
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.uuid-representation=standard

# --- Supabase S3 Storage ---
supabase.s3.enabled=${SUPABASE_S3_ENABLED:false}
supabase.s3.endpoint=${SUPABASE_S3_ENDPOINT:https://nkqyubnzckxojsubyiuk.storage.supabase.co/storage/v1/s3}
supabase.s3.region=${SUPABASE_S3_REGION:us-east-1}
supabase.s3.access-key-id=${SUPABASE_S3_ID:}
supabase.s3.secret-access-key=${SUPABASE_S3_KEY:}
supabase.s3.bucket=${SUPABASE_S3_BUCKET:remitos}
supabase.s3.public-url-base=${SUPABASE_S3_PUBLIC_BASE:https://nkqyubnzckxojsubyiuk.supabase.co/storage/v1/object/public/remitos}
