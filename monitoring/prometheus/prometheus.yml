global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "donatrack-services"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 5s
    static_configs:
      - targets:
          - "donaciones:8000"
          - "incentivos:8001"
          - "logistica:8002"
          - "notificaciones:8003"
          - "auth:8004"
          - "web:8080"
