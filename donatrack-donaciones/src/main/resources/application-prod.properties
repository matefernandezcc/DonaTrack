# =============================================
# Profile: prod (Supabase & CloudAMQP)
# Activar: SPRING_PROFILES_ACTIVE=prod
# =============================================

spring.datasource.url=jdbc:postgresql://${SUPABASE_HOST}:${SUPABASE_PORT:5432}/postgres?currentSchema=donaciones
spring.datasource.username=${SUPABASE_USER}
spring.datasource.password=${SUPABASE_PASSWORD}

# En prod las tablas ya están creadas en Supabase (evita timeout de escaneo Hibernate)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Pool de conexiones Hikari optimizado para Supabase Free Tier (máx 15 conexiones globales en Session Mode)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# RabbitMQ en la nube (CloudAMQP)
spring.rabbitmq.host=${CLOUDAMQP_HOST}
spring.rabbitmq.port=${CLOUDAMQP_PORT:5671}
spring.rabbitmq.username=${CLOUDAMQP_USERNAME}
spring.rabbitmq.password=${CLOUDAMQP_PASSWORD}
spring.rabbitmq.virtual-host=${CLOUDAMQP_VIRTUAL_HOST}
spring.rabbitmq.ssl.enabled=${CLOUDAMQP_SSL_ENABLED:true}

# Seguridad Inter-Servicios M2M (estricta en produccion)
donatrack.security.enabled=true
