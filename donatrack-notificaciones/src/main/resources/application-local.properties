# =============================================
# Profile: local (desarrollo con Docker Postgres)
# Activar: mvn spring-boot:run -Dspring-boot.run.profiles=local
# =============================================

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:donatrack}?currentSchema=notificaciones
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}

# Hibernate crea/actualiza tablas automáticamente en local
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
