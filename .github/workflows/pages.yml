name: Deploy static frontend to Pages

on:
    push:
        branches:
            - main

permissions:
    contents: read
    pages: write
    id-token: write

jobs:
    deploy:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Copy static frontend
              run: |
                  mkdir public
                  cp -R donatrack-server/src/main/resources/static/* public/

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  path: public

            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@v4
