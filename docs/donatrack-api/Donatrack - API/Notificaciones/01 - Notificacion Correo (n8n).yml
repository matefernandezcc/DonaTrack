info:
  name: 01 - Notificacion Correo (n8n)
  type: http
  seq: 1

http:
  method: POST
  url: "{{notificacionesUrl}}/api/mensajes"
  body:
    type: json
    data: |-
      {
        "destinatario": "donante@test.com",
        "mensaje": "¡Tu donación está en camino al comedor Los Bajitos!",
        "medio": "CORREO"
      }
  auth: inherit

assert:
  - expr: res.status
    oper: eq
    value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
