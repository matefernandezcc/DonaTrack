info:
  name: 03 - Notificacion WhatsApp (n8n)
  type: http
  seq: 3

http:
  method: POST
  url: "{{notificacionesUrl}}/api/mensajes"
  body:
    type: json
    data: |-
      {
        "destinatario": "+5491145678901",
        "mensaje": "Recordatorio: El camión de DonaTrack pasa hoy a las 15:00 hs por tu domicilio.",
        "medio": "WHATSAPP"
      }
  auth: inherit

assert:
  - expr: res.status
    oper: eq
    value: 200

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
