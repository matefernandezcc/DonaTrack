info:
  name: Eliminar Persona
  type: http
  seq: 4

http:
  method: DELETE
  url: "{{donacionesUrl}}/api/personas/:personaId"
  params:
    - name: personaId
      value: "{{personaCreadaId}}"
      type: path
  body: none
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("personaCreadaId")) {
          bru.setVar("personaCreadaId", "d8404b9a-0504-40c7-b8c5-0635faae4f2e");
        }


settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
