info:
  name: Importar CSV
  type: http
  seq: 6

http:
  method: POST
  url: "{{donacionesUrl}}/api/personas/importar-csv"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - ./Donaciones/Personas/donantes_sample.csv
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

