info:
  name: Actualizar Persona
  type: http
  seq: 3

http:
  method: PUT
  url: "{{donacionesUrl}}/api/personas/:personaId"
  params:
    - name: personaId
      value: "{{personaCreadaId}}"
      type: path
  body:
    type: json
    data: |-
      {
        "contacto": {
          "correoElectronico": "donante_nuevo@test.com",
          "telefono": "+5411223344",
          "whatsapp": "+5411223344",
          "medioPredeterminado": "CORREO"
        }
      }
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  scripts:
    - type: before-request
      code: |-
        if (!bru.getVar("personaCreadaId")) {
          bru.setVar("personaCreadaId", "d8404b9a-0504-40c7-b8c5-0635faae4f2e");
        }


settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
