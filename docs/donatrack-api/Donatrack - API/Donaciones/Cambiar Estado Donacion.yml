info:
  name: Cambiar Estado Donacion
  type: http
  seq: 7

http:
  method: PUT
  url: "{{donacionesUrl}}/api/donaciones/{{donacionId}}/estado"
  body:
    type: json
    data: |-
      {
        "nuevoEstado": "EN_TRASLADO",
        "observacion": "Cambio de estado manual por administrador"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
