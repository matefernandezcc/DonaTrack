info:
  name: Register
  type: http
  seq: 4

http:
  method: POST
  url: "{{authUrl}}/auth/register"
  body:
    type: json
    data: |-
      {
        "username": "nuevo.donante",
        "password": "Password123!",
        "nombreCompleto": "Juan Pérez",
        "email": "juan.perez@ejemplo.com",
        "rol": "DONANTE"
      }
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

