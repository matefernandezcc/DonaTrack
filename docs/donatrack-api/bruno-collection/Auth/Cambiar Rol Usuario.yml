info:
  name: Cambiar Rol Usuario
  type: http
  seq: 6

http:
  method: PUT
  url: "{{authUrl}}/admin/usuarios/a1111111-1111-4111-8111-111111111111/rol"
  body:
    type: json
    data: |-
      {
        "rol": "BENEFICIARIA"
      }
