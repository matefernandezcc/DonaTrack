info:
  name: Calculador Impacto
  type: http
  seq: 6

http:
  method: GET
  url: "{{webUrl}}/api/public/calculador-impacto?categoria=alimentos&cantidad=20"
  auth: none

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.categoria
      operator: eq
      value: Alimentos no Perecederos

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
