info:
  name: Reportar Falla
  type: http
  seq: 17

http:
  method: POST
  url: "{{logisticaUrl}}/api/entregas/:idDonacion/falla"
  params:
    - name: idDonacion
      value: 35008064-071a-4d7a-ac37-33318f7d9845
      type: path
  body:
    type: json
    data: |-
      {
        "motivo": "El beneficiario no se encontraba en el domicilio",
        "puedeReplanificarse": true
      }
