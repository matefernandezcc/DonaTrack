<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DonaTrack · Iniciar sesión</title>
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@salesforce-ux/design-system@2.30.3/assets/styles/salesforce-lightning-design-system.min.css" />
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body class="dt-login-body">
    <main class="dt-login-shell">
        <div class="slds-card dt-login-card">
            <div class="slds-p-around_x-large">
                <header class="slds-text-align_center slds-m-bottom_large">
                    <div class="dt-logo dt-logo_lg slds-m-bottom_small">
                        <span class="dt-logo__mark">D</span>
                        <span class="dt-logo__text">DonaTrack</span>
                    </div>
                    <p class="slds-text-body_small slds-text-color_weak">Plataforma de gestión de donaciones</p>
                </header>

                <div id="login-alert" class="slds-m-bottom_medium" hidden>
                    <div class="slds-notify slds-notify_alert slds-theme_alert-texture slds-theme_error" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <h2>Credenciales inválidas. Intenta nuevamente.</h2>
                    </div>
                </div>

                <form id="login-form" novalidate>
                    <div class="slds-form-element slds-m-bottom_medium">
                        <label class="slds-form-element__label" for="username">Usuario</label>
                        <div class="slds-form-element__control">
                            <input type="text" id="username" name="username" class="slds-input" autocomplete="username"
                                required />
                        </div>
                    </div>

                    <div class="slds-form-element slds-m-bottom_large">
                        <label class="slds-form-element__label" for="password">Contraseña</label>
                        <div class="slds-form-element__control">
                            <input type="password" id="password" name="password" class="slds-input"
                                autocomplete="current-password" required />
                        </div>
                    </div>

                    <button type="submit" class="slds-button slds-button_brand dt-block-button">Ingresar al
                        Panel</button>

                    <p class="slds-text-body_small slds-text-color_weak slds-text-align_center slds-m-top_medium">
                        Demo: <strong>admin</strong> / <strong>admin</strong>
                    </p>
                </form>
            </div>
        </div>
        <p class="slds-text-body_small slds-text-color_weak slds-text-align_center slds-m-top_medium">
            © DonaTrack · Panel de administración
        </p>
    </main>

    <script src="js/auth.js"></script>
    <script>DT_Auth.initLogin();</script>
</body>

</html>
