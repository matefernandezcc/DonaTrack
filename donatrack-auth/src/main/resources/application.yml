server:
  port: ${PORT:8004}
  forward-headers-strategy: framework

spring:
  application:
    name: donatrack-auth
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:donatrack}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        default_schema: auth
        dialect: org.hibernate.dialect.PostgreSQLDialect

donatrack:
  jwt-secret: ${JWT_SECRET:SuperSecretoDonaTrack2026ParaFirmaHS256DebeTenerAlMenos32Bytes!}
  jwt-ttl-minutes: ${JWT_TTL_MINUTES:120}
  web-url: ${WEB_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${SUPABASE_HOST:aws-1-us-east-1.pooler.supabase.com}:${SUPABASE_PORT:5432}/postgres
    username: ${SUPABASE_USER:postgres.nkqyubnzckxojsubyiuk}
    password: ${SUPABASE_PASSWORD:DonatrackSecreto2026!}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        default_schema: auth
        dialect: org.hibernate.dialect.PostgreSQLDialect

