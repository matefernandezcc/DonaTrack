<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="gta6-title gta6-desc">
  <title id="gta6-title">Campaña Solidaria Gamer y Recambio Tecnológico - DonaTrack</title>
  <desc id="gta6-desc">Ilustración estilo atardecer neón con consola, joystick y caja solidaria de DonaTrack</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1035" />
      <stop offset="48%" stop-color="#6b216b" />
      <stop offset="82%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="55%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#db2777" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.92" />
    </linearGradient>
  </defs>

  <!-- Fondo atardecer Vice City -->
  <rect width="800" height="450" fill="url(#sky)" />

  <!-- Sol retro -->
  <circle cx="400" cy="230" r="130" fill="url(#sun)" />
  <rect x="260" y="255" width="280" height="7" fill="#db2777" opacity="0.55" />
  <rect x="260" y="272" width="280" height="9" fill="#9d174d" opacity="0.65" />
  <rect x="260" y="292" width="280" height="12" fill="#701a75" opacity="0.75" />

  <!-- Silueta horizonte urbano -->
  <path d="M0 320 L0 265 L48 265 L48 230 L92 230 L92 275 L138 275 L138 210 L185 210 L185 270 L235 270 L235 290 L575 290 L575 245 L622 245 L622 205 L672 205 L672 258 L718 258 L718 228 L762 228 L762 275 L800 275 L800 320 Z" fill="#120b24" />

  <!-- Palmeras estilizadas -->
  <path d="M88 320 Q105 235 128 180" stroke="#090612" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M128 180 Q95 162 68 184 Q102 182 128 180 Q158 158 185 178 Q154 179 128 180 Q108 198 92 222 Q115 200 128 180 Q148 196 168 216 Z" fill="#090612" />

  <path d="M710 320 Q692 230 668 175" stroke="#090612" stroke-width="8" fill="none" stroke-linecap="round" />
  <path d="M668 175 Q635 156 608 178 Q640 176 668 175 Q698 154 728 174 Q695 176 668 175 Q648 194 630 216 Q654 195 668 175 Q688 195 706 216 Z" fill="#090612" />

  <!-- Suelo con grilla neón -->
  <rect x="0" y="320" width="800" height="130" fill="#0d081d" />
  <line x1="0" y1="320" x2="800" y2="320" stroke="#22d3ee" stroke-width="3" />
  <g stroke="#22d3ee" stroke-opacity="0.28" stroke-width="1.5">
    <line x1="0" y1="345" x2="800" y2="345" />
    <line x1="0" y1="378" x2="800" y2="378" />
    <line x1="0" y1="420" x2="800" y2="420" />
    <line x1="400" y1="320" x2="400" y2="450" />
    <line x1="320" y1="320" x2="180" y2="450" />
    <line x1="480" y1="320" x2="620" y2="450" />
    <line x1="230" y1="320" x2="0" y2="440" />
    <line x1="570" y1="320" x2="800" y2="440" />
  </g>

  <!-- Tarjeta central con Joystick + Caja Solidaria -->
  <rect x="195" y="92" width="410" height="252" rx="22" fill="url(#cardBg)" stroke="#22d3ee" stroke-width="2.5" />

  <!-- Badge superior -->
  <rect x="275" y="112" width="250" height="28" rx="14" fill="#16a34a" />
  <text x="400" y="131" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" letter-spacing="1">CAMPAÑA GAMER SOLIDARIA</text>

  <!-- Joystick ilustrado -->
  <g transform="translate(278, 165)">
    <path d="M52 24 H192 C214 24 232 42 234 65 L238 96 C240 112 224 122 210 114 L182 95 H62 L34 114 C20 122 4 112 6 96 L10 65 C12 42 30 24 52 24 Z" fill="#1e293b" stroke="#f472b6" stroke-width="3.5" />
    <!-- Cruceta izquierda -->
    <rect x="52" y="48" width="12" height="32" rx="3" fill="#22d3ee" />
    <rect x="42" y="58" width="32" height="12" rx="3" fill="#22d3ee" />
    <!-- Botones derechos -->
    <circle cx="182" cy="52" r="6.5" fill="#fde047" />
    <circle cx="198" cy="64" r="6.5" fill="#22c55e" />
    <circle cx="182" cy="76" r="6.5" fill="#22d3ee" />
    <circle cx="166" cy="64" r="6.5" fill="#f472b6" />
    <!-- Corazón solidario en el centro -->
    <path d="M122 57 C122 51 113 48 109 53 C105 48 96 51 96 57 C96 65 109 73 109 73 C109 73 122 65 122 57 Z" fill="#22c55e" />
  </g>

  <!-- Texto inferior -->
  <text x="400" y="303" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="19" font-weight="800" letter-spacing="0.4">RECAMBIO DE CONSOLAS &amp; VIDEOJUEGOS</text>
  <text x="400" y="325" text-anchor="middle" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12.5" font-weight="600">DONATRACK · JUGUETES Y RECREACIÓN PARA CENTROS JUVENILES</text>
</svg>
