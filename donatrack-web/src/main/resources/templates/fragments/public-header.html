<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<header class="nav" id="nav" th:fragment="header">

    <nav class="nav__links" aria-label="Navegación principal">

      <a th:href="@{/#mapa}">Mapa solidario</a>
      <a th:href="@{/#campanas}">Campañas</a>
    </nav>

    <div class="nav__cta">
      <button id="theme-toggle" class="theme-toggle" aria-label="Cambiar tema claro u oscuro" aria-pressed="false">
        <svg class="sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"

          <line x1="12" y1="1" x2="12" y2="3"></line>
          <line x1="12" y1="21" x2="12" y2="23"></line>
          <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
          <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
          <line x1="1" y1="12" x2="3" y2="12"></line>
          <line x1="21" y1="12" x2="23" y2="12"></line>
          <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
          <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
        </svg>
        <svg class="moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
        </svg>
      </button>
      <a th:href="@{/login}" class="btn btn--ghost">Iniciar sesión</a>

  <div class="nav__drawer" id="nav-drawer" hidden>
    <a th:href="@{/#recorrido}">Recorrido</a>
    <a th:href="@{/#que-donar}">Qué donar</a>
    <a th:href="@{/#impacto}">Impacto</a>
    <a th:href="@{/#mapa}">Mapa solidario</a>
    <a th:href="@{/#campanas}">Campañas</a>
    <a th:href="@{/#historias}">Historias reales</a>
