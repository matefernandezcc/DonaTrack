<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout-admin :: layout(~{::title}, ~{::#page-header-title}, ~{::#main-content-slot}, ~{})}">
<head>
  <title>DonaTrack · Registrar Donación</title>
</head>
<body>

  <span id="page-header-title">Registrar Nueva Donación de Bienes</span>

  <div id="main-content-slot">
    <article class="slds-card slds-m-bottom_large">
      <div class="slds-card__header slds-grid">
        <header class="slds-media slds-media_center slds-has-flexi-truncate">
          <div class="slds-media__body">
            <h2 class="slds-card__header-title">
              <span class="slds-text-heading_small">Carga de Recepción en Depósito DonaTrack</span>
            </h2>
          </div>
        </header>
      </div>
      <div class="slds-card__body slds-card__body_inner">
        <p class="slds-m-bottom_medium">
          Al registrar la donación, se ingresa al módulo central con estado <code>RECEPCIONADA</code> y se activa inmediatamente para el proceso de matchmaking y planificación logística.
        </p>

        <form th:action="@{/app/donante/donaciones}" method="post">
          <div class="slds-form slds-form_stacked">
            
            <div class="slds-form-element slds-m-bottom_small">
              <label class="slds-form-element__label" for="descripcion">
                <abbr class="slds-required" title="obligatorio">* </abbr>Descripción del Bien
              </label>
              <div class="slds-form-element__control">
                <input class="slds-input" type="text" id="descripcion" name="descripcion"
                       placeholder="Ej: Paquete de arroz 1kg, Campera de abrigo, etc." required />
              </div>
            </div>

            <div class="slds-grid slds-gutters_small slds-m-bottom_small">
              <div class="slds-col slds-size_1-of-2">
                <div class="slds-form-element">
                  <label class="slds-form-element__label" for="cantidad">
                    <abbr class="slds-required" title="obligatorio">* </abbr>Cantidad
                  </label>
                  <div class="slds-form-element__control">
                    <input class="slds-input" type="number" step="0.5" id="cantidad" name="cantidad" value="10" required />
                  </div>
                </div>
              </div>
              <div class="slds-col slds-size_1-of-2">
                <div class="slds-form-element">
                  <label class="slds-form-element__label" for="unidadMedicion">Unidad de Medida</label>
                  <div class="slds-form-element__control">
                    <select class="slds-select" id="unidadMedicion" name="unidadMedicion">
                      <option value="KILOS" selected>Kilos (kg)</option>
                      <option value="UNIDADES">Unidades (u)</option>
                      <option value="LITROS">Litros (l)</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div class="slds-grid slds-gutters_small slds-m-bottom_medium">
              <div class="slds-col slds-size_1-of-2">
                <div class="slds-form-element">
                  <label class="slds-form-element__label" for="subcategoria">Subcategoría</label>
                  <div class="slds-form-element__control">
                    <select class="slds-select" id="subcategoria" name="nombreSubcategoria">
                      <option value="No Perecederos" selected>No Perecederos</option>
                      <option value="Abrigo">Abrigo / Ropa</option>
                      <option value="Higiene">Artículos de Higiene</option>
                      <option value="Medicamentos">Medicamentos</option>
                    </select>
                  </div>
                </div>
              </div>
              <div class="slds-col slds-size_1-of-2">
                <div class="slds-form-element">
                  <label class="slds-form-element__label" for="esUsado">Condición del Bien</label>
                  <div class="slds-form-element__control">
                    <select class="slds-select" id="esUsado" name="esUsado">
                      <option value="false" selected>Nuevo</option>
                      <option value="true">Usado en buen estado</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <button class="slds-button slds-button_brand" type="submit">
              Confirmar Recepción de Donación
            </button>
          </div>
        </form>
      </div>
    </article>
  </div>

</body>
</html>
