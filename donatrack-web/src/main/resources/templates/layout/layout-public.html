<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content, scripts)">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
  <title th:replace="${title}">DonaTrack · Donaciones con Trazabilidad</title>
  <meta name="description"
    content="DonaTrack conecta donaciones con organizaciones beneficiarias y permite seguir cada entrega de forma transparente." />
  <meta name="theme-color" content="#0B4A8F" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
    rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

  <!-- SOLO CSS público. Aislamiento estricto: Prohibido cargar SLDS acá. -->
  <link rel="stylesheet" th:href="@{/css/variables.css}" />
  <link rel="stylesheet" th:href="@{/css/base.css}" />
  <link rel="stylesheet" th:href="@{/css/components.css}" />
  <link rel="stylesheet" th:href="@{/css/sections.css}" />

  <link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}" />

  <script>
    const dtTheme = localStorage.getItem("dt-theme");
    if (dtTheme === "dark" || (!dtTheme && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
      document.documentElement.setAttribute("data-theme", "dark");
    }
  </script>

  <!-- Salesforce Data 360 / Data Cloud Beacon SDK -->
  <script src="https://cdn.c360a.salesforce.com/beacon/c360a/9ab3777e-2275-4b8b-9015-8082f174b440/scripts/c360a.min.js"
    async defer></script>
</head>

<body class="dt-public">
  <header th:replace="~{fragments/public-header :: header}"></header>

  <!-- SLOT: Contenido de cada página pública -->
  <main id="contenido" th:replace="${content}">
    <p>Contenido principal</p>
  </main>

  <footer th:replace="~{fragments/public-footer :: footer}"></footer>

  <!-- ============ CHATBOT ROUTER: SALESFORCE EMBEDDED SERVICE & N8N FALLBACK ============ -->
  <template id="n8n-chatbot-template">
    <button class="chatbot__fab" id="chat-fab" aria-label="Abrir asistente" aria-expanded="false"
      aria-controls="chat-panel">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H9l-5 4V5Z" fill="currentColor" />
      </svg>
    </button>
    <dialog class="chatbot" id="chat-panel" aria-modal="false" aria-labelledby="chat-title" hidden>
      <header class="chatbot__head">
        <div class="chatbot__who">
          <span class="chatbot__avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10" fill="#1F9D6E" />
              <path d="M8 13c1 1.5 2.5 2 4 2s3-.5 4-2" stroke="#fff" stroke-width="2" stroke-linecap="round"
                fill="none" />
              <circle cx="9" cy="10" r="1" fill="#fff" />
              <circle cx="15" cy="10" r="1" fill="#fff" />
            </svg>
          </span>
          <div>
            <strong id="chat-title">Asistente DonaTrack</strong>
            <span class="chatbot__status"><i></i> En línea</span>
          </div>
        </div>
        <button class="chatbot__close" id="chat-close" aria-label="Cerrar chat">&times;</button>
      </header>
      <div class="chatbot__log" id="chat-log">
        <div class="msg msg--bot">¡Hola! Soy el asistente virtual de DonaTrack. ¿En qué te puedo ayudar hoy?</div>
      </div>
      <div class="chatbot__chips">
        <button class="chip" type="button" data-q="¿Cómo donar?">¿Cómo donar?</button>
        <button class="chip" type="button" data-q="Rastrear remito">Rastreo</button>
        <button class="chip" type="button" data-q="Verificar ONG">Verificar ONG</button>
      </div>
      <form class="chatbot__form" id="chat-form">
        <label for="chat-input" class="sr-only">Escribí tu mensaje</label>
        <input id="chat-input" type="text" placeholder="Escribí tu mensaje…" autocomplete="off" />
        <button type="submit" class="btn btn--primary btn--sm" aria-label="Enviar">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 11 21 3l-8 18-2-8-8-2Z" stroke="currentColor" stroke-width="2" fill="none"
              stroke-linejoin="round" />
          </svg>
        </button>
      </form>
    </dialog>
  </template>

  <script>
    (function () {
      const hostname = window.location.hostname;
      // Salesforce activo en dominios autorizados de producción o túneles de demo
      const isSalesforceDomain = hostname.endsWith('onrender.com') ||
        hostname === 'exclude-stoplight-registrar.ngrok-free.dev' ||
        hostname.includes('donatrack.org');

      function loadLocalChatbot() {
        if (document.getElementById("chat-fab")) return;
        const tpl = document.getElementById("n8n-chatbot-template");
        if (tpl) {
          tpl.parentNode.insertBefore(tpl.content.cloneNode(true), tpl);
          const s = document.createElement("script");
          s.src = "/js/chatbot.js";
          document.body.appendChild(s);
        }
      }

      if (isSalesforceDomain) {
        window.initEmbeddedMessaging = function () {
          try {
            embeddedservice_bootstrap.settings.language = 'es_AR';
            embeddedservice_bootstrap.init(
              '00DKh000001LcL5',
              'Chatbot_DonaTrack',
              'https://be1776887191673.my.site.com/ESWChatbotDonaTrack1780800682238',
              { scrt2URL: 'https://be1776887191673.my.salesforce-scrt.com' }
            );
          } catch (e) {
            console.warn("Excepción al inicializar Salesforce Embedded Messaging, activando asistente n8n:", e);
            loadLocalChatbot();
          }
        };

        const sf = document.createElement("script");
        sf.type = "text/javascript";
        sf.src = "https://be1776887191673.my.site.com/ESWChatbotDonaTrack1780800682238/assets/js/bootstrap.min.js";
        sf.onload = window.initEmbeddedMessaging;
        sf.onerror = function () {
          console.warn("No se pudo conectar a Salesforce, activando asistente n8n de respaldo.");
          loadLocalChatbot();
        };
        document.body.appendChild(sf);
      } else {
        loadLocalChatbot();
      }
    })();
  </script>

  <!-- Leaflet y JS común -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script th:src="@{/js/app.js}" defer></script>

  <!-- SLOT: Scripts específicos de la vista -->
  <th:block th:replace="${scripts}"></th:block>
</body>

</html>
