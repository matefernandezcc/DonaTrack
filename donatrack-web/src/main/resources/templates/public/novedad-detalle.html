<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/layout-public :: layout(~{::title}, ~{::main}, ~{::scripts})}">
<head>
  <title th:text="${novedad['titulo']} + ' · DonaTrack'">Detalle de novedad · DonaTrack</title>
</head>
<body>
  <main id="contenido">
    <section class="novedad-post-sec">
      <div class="container">
        <article class="novedad-post__container">
          <a th:href="@{/novedades}" class="novedad-post__breadcrumb">
            <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            Volver a Novedades
          </a>

          <header class="novedad-post__header">
            <time class="novedad-post__date" th:text="${novedad['fechaCorta']}">11/15/2026</time>
            <h1 class="novedad-post__title" th:text="${novedad['titulo']}">
              Título de la novedad
            </h1>
          </header>

          <figure class="novedad-post__hero">
            <img th:src="@{${novedad['imagen']}}" th:alt="${novedad['titulo']}" />
          </figure>

          <div class="novedad-post__body">
            <p th:each="p : ${novedad['parrafosIntro']}" th:text="${p}">
              Párrafo introductorio...
            </p>

            <th:block th:each="sec : ${novedad['secciones']}">
              <h2 class="novedad-post__subtitle" th:text="${sec['subtitulo']}">Subtítulo de sección</h2>
              <p th:each="sp : ${sec['parrafos']}" th:text="${sp}">Párrafo de sección...</p>
            </th:block>
          </div>

          <div class="novedad-post__share" aria-label="Compartir artículo">
            <span class="novedad-post__share-label">Compartir</span>
            <div class="novedad-post__share-links">
              <a id="share-facebook" class="novedad-share-btn" target="_blank" rel="noopener noreferrer" href="#">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M14 13.5h2.5l1-4H14v-2c0-1.03 0-2 2-2h1.5V2.14c-.326-.043-1.557-.14-2.857-.14C11.928 2 10 3.657 10 6.7v2.8H7v4h3V22h4v-8.5z"/></svg>
                Facebook
              </a>
              <a id="share-twitter" class="novedad-share-btn" target="_blank" rel="noopener noreferrer" href="#">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
                Twitter
              </a>
              <a id="share-linkedin" class="novedad-share-btn" target="_blank" rel="noopener noreferrer" href="#">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.94 5a2 2 0 1 1-4-.002 2 2 0 0 1 4 .002zM7 8.48H3V21h4V8.48zm6.32 0H9.34V21h3.94v-6.57c0-3.66 4.77-4 4.77 0V21H22v-7.93c0-6.17-7.06-5.94-8.72-2.91l.04-1.68z"/></svg>
                Linkedin
              </a>
              <a id="share-whatsapp" class="novedad-share-btn" target="_blank" rel="noopener noreferrer" href="#">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.04 2m5.81 13.99c-.25.7-1.45 1.34-2.01 1.42-.51.07-1.16.1-1.87-.12-.44-.14-.99-.33-1.71-.64-3.01-1.3-4.97-4.33-5.12-4.53-.15-.2-1.22-1.63-1.22-3.11 0-1.48.77-2.21 1.05-2.51.27-.3.6-.38.8-.38.2 0 .4.01.57.01.19 0 .44-.07.69.53.25.6.86 2.09.94 2.24.07.15.12.33.02.53-.1.2-.15.33-.3.5-.15.17-.32.39-.45.52-.15.15-.31.32-.13.62.18.3.8 1.31 1.71 2.13 1.18 1.05 2.17 1.38 2.47 1.53.3.15.48.12.66-.08.18-.2.76-.88.96-1.18.2-.3.4-.25.67-.15.27.1 1.74.82 2.04.97.3.15.5.22.57.34.07.12.07.7-.18 1.4z"/></svg>
                Whatsapp
              </a>
              <a id="share-email" class="novedad-share-btn" href="#">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="m22 6-10 7L2 6"/></svg>
                Email
              </a>
            </div>
          </div>
        </article>

        <section class="novedad-latest" aria-labelledby="ultimas-novedades-heading"
                 th:if="${ultimasNovedades != null and not #lists.isEmpty(ultimasNovedades)}">
          <h2 id="ultimas-novedades-heading" class="novedad-latest__heading">Últimas novedades</h2>
          <div class="novedades-grid">
            <article class="novedad-card" th:each="u : ${ultimasNovedades}">
              <a class="novedad-card__media" th:href="@{/novedades/{id}(id=${u['id']})}">
                <img class="novedad-card__img" th:src="@{${u['imagen']}}" th:alt="${u['titulo']}" loading="lazy" />
              </a>
              <div class="novedad-card__body">
                <h3 class="novedad-card__title">
                  <a th:href="@{/novedades/{id}(id=${u['id']})}" th:text="${u['titulo']}">Título</a>
                </h3>
                <div class="novedad-card__date-row">
                  <svg class="novedad-card__date-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="4" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="2" />
                    <path d="M16 2v4M8 2v4M3 10h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                  </svg>
                  <time class="novedad-card__date" th:text="${u['fecha']}">noviembre 11, 2026</time>
                </div>
                <p class="novedad-card__excerpt" th:text="${u['resumen']}">Resumen...</p>
                <div class="novedad-card__actions">
                  <a th:href="@{/novedades/{id}(id=${u['id']})}" class="novedad-card__btn">Leer más</a>
                </div>
              </div>
            </article>
          </div>
        </section>
      </div>
    </section>
  </main>

  <th:block th:fragment="scripts">
    <script th:inline="javascript">
      (function () {
        var pageUrl = encodeURIComponent(window.location.href);
        var title = encodeURIComponent(/*[[${novedad['titulo']}]]*/ document.title);
        var fb = document.getElementById('share-facebook');
        var tw = document.getElementById('share-twitter');
        var li = document.getElementById('share-linkedin');
        var wa = document.getElementById('share-whatsapp');
        var em = document.getElementById('share-email');
        if (fb) fb.href = 'https://www.facebook.com/sharer/sharer.php?u=' + pageUrl;
        if (tw) tw.href = 'https://twitter.com/intent/tweet?text=' + title + '&url=' + pageUrl;
        if (li) li.href = 'https://www.linkedin.com/sharing/share-offsite/?url=' + pageUrl;
        if (wa) wa.href = 'https://wa.me/?text=' + title + '%20' + pageUrl;
        if (em) em.href = 'mailto:?subject=' + title + '&body=' + pageUrl;
      })();
    </script>
  </th:block>
</body>
</html>
