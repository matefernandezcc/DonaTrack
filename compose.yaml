services:
  postgres-donatrack:
    image: postgres:15-alpine
    container_name: postgres_donatrack
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql

  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: n8n_donatrack
    restart: always
    ports:
      - "5678:5678"
    environment:
      # Zona horaria para que las ejecuciones programadas (cron) funcionen con la hora local
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      # Habilita peticiones cruzadas para la API de n8n
      - N8N_CORS_ALLOWED_ORIGINS=*
      # Webhook de Discord para publicar notificaciones de insignias y rankings
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1545253873785118740/fQ46oGTgcP5UZbcZmiVL7JIUblz71AUCVjzIDq7WnXYTCR-kT217cPlgGdNiGWnGm6jR
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows # Carpeta local para importar/exportar los JSON de tus workflows

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: rabbitmq_donatrack
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: donatrack
      RABBITMQ_DEFAULT_PASS: donatrack
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  donaciones:
    build:
      context: ./donatrack-donaciones
    container_name: donatrack-donaciones
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres-donatrack
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_donatrack:5432/${POSTGRES_DB}?currentSchema=donaciones
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=donatrack
      - SPRING_RABBITMQ_PASSWORD=donatrack

  incentivos:
    build:
      context: ./donatrack-incentivos
    container_name: donatrack-incentivos
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      - postgres-donatrack
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_donatrack:5432/${POSTGRES_DB}?currentSchema=incentivos
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=donatrack
      - SPRING_RABBITMQ_PASSWORD=donatrack

  logistica:
    build:
      context: ./donatrack-logistica
    container_name: donatrack-logistica
    restart: always
    ports:
      - "8002:8002"
    depends_on:
      - postgres-donatrack
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_donatrack:5432/${POSTGRES_DB}?currentSchema=logistica
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_PROFILES_ACTIVE=default
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=donatrack
      - SPRING_RABBITMQ_PASSWORD=donatrack

  notificaciones:
    build:
      context: ./donatrack-notificaciones
    container_name: donatrack-notificaciones
    restart: always
    ports:
      - "8003:8003"
    depends_on:
      - postgres-donatrack
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_donatrack:5432/${POSTGRES_DB}?currentSchema=notificaciones
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_USERNAME=donatrack
      - SPRING_RABBITMQ_PASSWORD=donatrack

  server:
    build:
      context: ./donatrack-server
    container_name: donatrack-server
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres-donatrack
    env_file:
      - .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres_donatrack:5432/${POSTGRES_DB}?currentSchema=public
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD}

volumes:
  postgres_data:
  n8n_data:
  rabbitmq_data:
