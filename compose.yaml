services:
  postgres-donatrack:
    image: postgres:15-alpine
    container_name: postgres_donatrack
    profiles: ["local"]
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-donatrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/local-seed-data.sql:/docker-entrypoint-initdb.d/z-local-seed-data.sql

  mongo-donatrack:
    image: mongo:7-jammy
    container_name: mongo_donatrack
    profiles: ["local"]
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-donatrack}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-donatrack}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-donatrack_logistica}
    volumes:
      - mongo_data:/data/db
      - ./database/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.7
    container_name: n8n_donatrack
    profiles: ["local"]
    restart: always
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      - N8N_CORS_ALLOWED_ORIGINS=*
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN_BASE64=${TWILIO_AUTH_TOKEN_BASE64}
      - TWILIO_CONTENT_SID=${TWILIO_CONTENT_SID}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: rabbitmq_donatrack
    profiles: ["local"]
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_LOCAL_USERNAME:-donatrack}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_LOCAL_PASSWORD:-donatrack}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  zipkin:
    image: openzipkin/zipkin:3.4
    container_name: zipkin_donatrack
    restart: unless-stopped
    ports:
      - "9411:9411"
    environment:
      - STORAGE_TYPE=mem

  prometheus:
    image: prom/prometheus:v3.3.0
    container_name: prometheus_donatrack
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"

  grafana:
    image: grafana/grafana:12.0.0
    container_name: grafana_donatrack
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal_donatrack
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  donaciones:
    build:
      context: .
      dockerfile: ./donatrack-donaciones/Dockerfile
    container_name: donatrack-donaciones
    restart: always
    labels:
      - "autoheal=true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8000/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
      zipkin:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_SSL_ENABLED=false
      - RABBITMQ_VIRTUAL_HOST=/
      - RABBITMQ_USERNAME=${RABBITMQ_LOCAL_USERNAME:-donatrack}
      - RABBITMQ_PASSWORD=${RABBITMQ_LOCAL_PASSWORD:-donatrack}
      - LOGISTICA_URL_LOCAL=${LOGISTICA_URL_LOCAL:-http://logistica:8002}
      - LOGISTICA_URL_REMOTA=${LOGISTICA_URL_REMOTA:-https://dona-logistica.onrender.com}
      - LOGISTICA_URL_REMOTA1=${LOGISTICA_URL_REMOTA1:-https://dona-logistica.onrender.com}
      - LOGISTICA_URL_REMOTA2=${LOGISTICA_URL_REMOTA2:-https://dona-logistica.onrender.com}
      - FEIGN_CLIENT_CONFIG_INCENTIVOS_URL=http://incentivos:8001/api
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  incentivos:
    build:
      context: .
      dockerfile: ./donatrack-incentivos/Dockerfile
    container_name: donatrack-incentivos
    restart: always
    labels:
      - "autoheal=true"
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8001/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
      zipkin:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_SSL_ENABLED=false
      - RABBITMQ_VIRTUAL_HOST=/
      - RABBITMQ_USERNAME=${RABBITMQ_LOCAL_USERNAME:-donatrack}
      - RABBITMQ_PASSWORD=${RABBITMQ_LOCAL_PASSWORD:-donatrack}
      - LOGISTICA_URL_LOCAL=${LOGISTICA_URL_LOCAL:-http://logistica:8002}
      - PERSONAS_API_URL=http://donaciones:8000
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/donatrack/badge-earned
      - N8N_WEBHOOK_RANKING_URL=http://n8n:5678/webhook/donatrack/ranking
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  logistica:
    build:
      context: .
      dockerfile: ./donatrack-logistica/Dockerfile
    container_name: donatrack-logistica
    restart: always
    labels:
      - "autoheal=true"
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8002/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      mongo-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
      zipkin:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - MONGO_HOST=mongo-donatrack
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_SSL_ENABLED=false
      - RABBITMQ_VIRTUAL_HOST=/
      - RABBITMQ_USERNAME=${RABBITMQ_LOCAL_USERNAME:-donatrack}
      - RABBITMQ_PASSWORD=${RABBITMQ_LOCAL_PASSWORD:-donatrack}
      - LOGISTICA_URL_LOCAL=${LOGISTICA_URL_LOCAL:-http://logistica:8002}
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  notificaciones:
    build:
      context: .
      dockerfile: ./donatrack-notificaciones/Dockerfile
    container_name: donatrack-notificaciones
    restart: always
    labels:
      - "autoheal=true"
    ports:
      - "8003:8003"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8003/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
      zipkin:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_SSL_ENABLED=false
      - RABBITMQ_VIRTUAL_HOST=/
      - RABBITMQ_USERNAME=${RABBITMQ_LOCAL_USERNAME:-donatrack}
      - RABBITMQ_PASSWORD=${RABBITMQ_LOCAL_PASSWORD:-donatrack}
      - LOGISTICA_URL_LOCAL=${LOGISTICA_URL_LOCAL:-http://logistica:8002}
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  auth:
    build:
      context: .
      dockerfile: ./donatrack-auth/Dockerfile
    container_name: donatrack-auth
    restart: always
    labels:
      - "autoheal=true"
    ports:
      - "8004:8004"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8004/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres-donatrack:
        condition: service_started
        required: false
      zipkin:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - JWT_SECRET=${JWT_SECRET:-SuperSecretoDonaTrack2026ParaFirmaHS256DebeTenerAlMenos32Bytes!}
      - WEB_URL=${WEB_URL:-http://localhost:8080}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID:-}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET:-}
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

  web:
    build:
      context: .
      dockerfile: ./donatrack-web/Dockerfile
    container_name: donatrack-web
    restart: always
    labels:
      - "autoheal=true"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - auth
      - logistica
      - donaciones
      - incentivos
      - zipkin
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - JWT_SECRET=${JWT_SECRET:-SuperSecretoDonaTrack2026ParaFirmaHS256DebeTenerAlMenos32Bytes!}
      - AUTH_URL=http://auth:8004
      - AUTH_PUBLIC_URL=${AUTH_PUBLIC_URL:-http://localhost:8004}
      - DONACIONES_URL=http://donaciones:8000
      - INCENTIVOS_URL=http://incentivos:8001
      - LOGISTICA_URL=http://logistica:8002
      - NOTIFICACIONES_URL=http://notificaciones:8003
      - N8N_URL=http://n8n:5678
      - ZIPKIN_ENDPOINT=http://zipkin:9411/api/v2/spans

volumes:
  postgres_data:
  mongo_data:
  n8n_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:
