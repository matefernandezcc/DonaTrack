services:
  postgres-donatrack:
    image: postgres:15-alpine
    container_name: postgres_donatrack
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-donatrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./local-seed-data.sql:/docker-entrypoint-initdb.d/z-local-seed-data.sql

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.7
    container_name: n8n_donatrack
    restart: always
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      - N8N_CORS_ALLOWED_ORIGINS=*
      - DISCORD_WEBHOOK_URL=https://discord.com/api/webhooks/1545253873785118740/fQ46oGTgcP5UZbcZmiVL7JIUblz71AUCVjzIDq7WnXYTCR-kT217cPlgGdNiGWnGm6jR
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: rabbitmq_donatrack
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-donatrack}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-donatrack}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  donaciones:
    build:
      context: ./donatrack-donaciones
    container_name: donatrack-donaciones
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - postgres-donatrack
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq

  incentivos:
    build:
      context: ./donatrack-incentivos
    container_name: donatrack-incentivos
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      - postgres-donatrack
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq

  logistica:
    build:
      context: ./
      dockerfile: donatrack-logistica/Dockerfile
    container_name: donatrack-logistica
    restart: always
    ports:
      - "8002:8002"
    depends_on:
      - postgres-donatrack
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq

  notificaciones:
    build:
      context: ./donatrack-notificaciones
    container_name: donatrack-notificaciones
    restart: always
    ports:
      - "8003:8003"
    depends_on:
      - postgres-donatrack
      - rabbitmq
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq

  server:
    build:
      context: ./donatrack-server
    container_name: donatrack-server
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - postgres-donatrack
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack

volumes:
  postgres_data:
  n8n_data:
  rabbitmq_data:
