services:
  postgres-donatrack:
    image: postgres:15-alpine
    container_name: postgres_donatrack
    profiles: ["local"]
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-donatrack}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./database/local-seed-data.sql:/docker-entrypoint-initdb.d/z-local-seed-data.sql

  mongo-donatrack:
    image: mongo:7-jammy
    container_name: mongo_donatrack
    profiles: ["local"]
    restart: always
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-donatrack}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-donatrack}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-donatrack_logistica}
    volumes:
      - mongo_data:/data/db

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.39.7
    container_name: n8n_donatrack
    profiles: ["local"]
    restart: always
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=America/Argentina/Buenos_Aires
      - TZ=America/Argentina/Buenos_Aires
      - N8N_CORS_ALLOWED_ORIGINS=*
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN_BASE64=${TWILIO_AUTH_TOKEN_BASE64}
      - TWILIO_CONTENT_SID=${TWILIO_CONTENT_SID}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n/workflows:/workflows

  rabbitmq:
    image: rabbitmq:4.3.2-management-alpine
    container_name: rabbitmq_donatrack
    profiles: ["local"]
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-donatrack}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-donatrack}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  donaciones:
    build:
      context: ./donatrack-donaciones
    container_name: donatrack-donaciones
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      postgres-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq
      - LOGISTICA_URL_LOCAL=http://logistica:8002
      - LOGISTICA_URL_REMOTA=http://logistica:8002
      - LOGISTICA_URL_REMOTA1=http://logistica:8002
      - LOGISTICA_URL_REMOTA2=http://logistica:8002

  incentivos:
    build:
      context: ./donatrack-incentivos
    container_name: donatrack-incentivos
    restart: always
    ports:
      - "8001:8001"
    depends_on:
      postgres-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq
      - LOGISTICA_URL_LOCAL=http://logistica:8002

  logistica:
    build:
      context: ./donatrack-logistica
    container_name: donatrack-logistica
    restart: always
    ports:
      - "8002:8002"
    depends_on:
      mongo-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - MONGO_HOST=mongo-donatrack
      - RABBITMQ_HOST=rabbitmq
      - LOGISTICA_URL_LOCAL=http://logistica:8002

  notificaciones:
    build:
      context: ./donatrack-notificaciones
    container_name: donatrack-notificaciones
    restart: always
    ports:
      - "8003:8003"
    depends_on:
      postgres-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - RABBITMQ_HOST=rabbitmq
      - LOGISTICA_URL_LOCAL=http://logistica:8002

  server:
    build:
      context: ./donatrack-server
    container_name: donatrack-server
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      postgres-donatrack:
        condition: service_started
        required: false
      mongo-donatrack:
        condition: service_started
        required: false
      rabbitmq:
        condition: service_started
        required: false
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-local}
      - POSTGRES_HOST=postgres-donatrack
      - MONGO_HOST=mongo-donatrack
      - RABBITMQ_HOST=rabbitmq
      - LOGISTICA_URL_LOCAL=http://logistica:8002

volumes:
  postgres_data:
  mongo_data:
  n8n_data:
  rabbitmq_data:
